<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/media.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <!-- <script src="https://kit.fontawesome.com/1dc055f0a8.js" crossorigin="anonymous"></script> -->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    
<section class="container-fluid bg-light py-5">

    <div class="container py-4">

        <div class="row align-items-center g-4">

            <!-- LEFT CONTENT -->
            <div class="col-lg-4">

                <div class="mb-4">
                    <p class="text-uppercase text-secondary small fw-medium 
                              mb-0"
                       style="letter-spacing: .25em;">
                        Industries
                    </p>
                </div>

                <h2 class="text-uppercase fw-bold lh-1 display-4 mb-0">
                    Different<br>
                    Industries.<br>

                    <span class="text-primary">
                        Real Solutions.
                    </span>
                </h2>

            </div>


            <!-- RIGHT CARDS -->
            <div class="col-lg-8">

                <div class="row g-2">

                    <!-- FINANCIAL SERVICES -->
                    <div class="col-6 col-md-3">

                        <div class="position-relative overflow-hidden 
                                    rounded-1"
                             style="height: 300px;">

                            <img src="/images/financial.jpg"
                                 class="position-absolute top-0 start-0 
                                        w-100 h-100 object-fit-cover"
                                 alt="Financial Services">

                            <div class="position-absolute top-0 start-0 
                                        w-100 h-100 bg-dark opacity-25">
                            </div>

                            <div class="position-absolute bottom-0 start-0 
                                        w-100 p-3 text-white">

                                <h6 class="fw-bold text-uppercase mb-3">
                                    Financial<br>
                                    Services
                                </h6>

                                <span class="fs-5">
                                    →
                                </span>

                            </div>

                        </div>

                    </div>


                    <!-- HEALTHCARE -->
                    <div class="col-6 col-md-3">

                        <div class="position-relative overflow-hidden 
                                    rounded-1"
                             style="height: 300px;">

                            <img src="/images/healthcare.jpg"
                                 class="position-absolute top-0 start-0 
                                        w-100 object-fit-cover"
                                 style="height: 145px;"
                                 alt="Healthcare">

                            <div class="position-absolute bottom-0 start-0 
                                        w-100 p-3 bg-white">

                                <h6 class="fw-bold text-uppercase mb-3">
                                    Healthcare
                                </h6>

                                <span class="text-dark fs-5">
                                    →
                                </span>

                            </div>

                        </div>

                    </div>


                    <!-- MANUFACTURING -->
                    <div class="col-6 col-md-3">

                        <div class="position-relative overflow-hidden 
                                    rounded-1"
                             style="height: 300px;">

                            <img src="/images/manufacturing.jpg"
                                 class="position-absolute top-0 start-0 
                                        w-100 h-100 object-fit-cover"
                                 alt="Manufacturing">

                            <div class="position-absolute top-0 start-0 
                                        w-100 h-100 bg-dark opacity-50">
                            </div>

                            <div class="position-absolute bottom-0 start-0 
                                        w-100 p-3 text-white">

                                <h6 class="fw-bold text-uppercase mb-3">
                                    Manufacturing
                                </h6>

                                <span class="fs-5">
                                    →
                                </span>

                            </div>

                        </div>

                    </div>


                    <!-- AND BEYOND -->
                    <div class="col-6 col-md-3">

                        <div class="h-100 bg-primary text-white rounded-1 
                                    p-4 d-flex flex-column 
                                    justify-content-center">

                            <h5 class="fw-bold text-uppercase mb-4">
                                And<br>
                                Beyond.
                            </h5>

                            <span class="fs-4">
                                →
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
</section>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
